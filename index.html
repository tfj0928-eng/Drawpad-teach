<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自由畫板">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>iPad 自由畫板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
</head>
<body>
<style>
/* Layout: full-screen canvas; floating tool rail on the left, context bar + actions on top, zoom/pages bottom-right */
:root{
  --app:#e6e8ec;
  --chrome:rgba(255,255,255,.9);
  --chrome-solid:#ffffff;
  --ink:#1a1c22;
  --muted:#666c78;
  --line:rgba(24,28,44,.12);
  --hover:rgba(24,28,44,.06);
  --accent:#2e4fd6;
  --accent-ink:#ffffff;
  --accent-soft:rgba(46,79,214,.12);
  --danger:#c92a2a;
  --shadow:0 8px 28px rgba(18,22,40,.13),0 1px 3px rgba(18,22,40,.08);
  --ui:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --app:#0e0f12;--chrome:rgba(30,32,38,.9);--chrome-solid:#1e2026;--ink:#eceef3;--muted:#9aa0ac;
    --line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.07);--accent:#7f97ff;--accent-ink:#0e1230;
    --accent-soft:rgba(127,151,255,.16);--danger:#ff8787;--shadow:0 8px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --app:#0e0f12;--chrome:rgba(30,32,38,.9);--chrome-solid:#1e2026;--ink:#eceef3;--muted:#9aa0ac;
  --line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.07);--accent:#7f97ff;--accent-ink:#0e1230;
  --accent-soft:rgba(127,151,255,.16);--danger:#ff8787;--shadow:0 8px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--app);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#board{touch-action:none}
button{font-family:var(--ui);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chrome{background:var(--chrome);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}

/* tool rail */
.rail{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:20px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;scrollbar-width:none;z-index:5}
.tool{width:56px;min-height:52px;border:0;background:transparent;color:var(--ink);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;letter-spacing:.04em;cursor:pointer;flex:none}
.tool:hover{background:var(--hover)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rail hr{border:0;border-top:1px solid var(--line);margin:4px 8px;flex:none}

/* top area */
.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(88px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:6}
.top>*{pointer-events:auto}
.props{flex:0 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:center;row-gap:4px;padding:5px 4px;border-radius:18px}
.grp{display:flex;align-items:center;gap:8px;padding:0 10px;min-height:42px;flex:none}
.grp.sep{border-left:1px solid var(--line)}
.grp.hint{font-size:13px;color:var(--muted);max-width:340px;flex:0 1 auto}
.actions{margin-left:auto;display:flex;gap:2px;padding:5px;border-radius:18px;flex:none}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{background:var(--hover)}
.ib:disabled{opacity:.32;cursor:default}
.ib[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.ib.lab{width:auto;padding:0 12px;display:flex;gap:6px;font-size:14px;font-weight:500}

.swatches{display:flex;gap:6px}
.swc{width:30px;height:30px;border-radius:50%;border:0;padding:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);cursor:pointer;flex:none;position:relative}
.swc[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:2px}
.swc.custom{background:conic-gradient(#e03131,#f2b705,#2f9e44,#1c7ed6,#5f3dc4,#d6336c,#e03131);overflow:hidden}
.swc.custom input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;cursor:pointer;border:0;padding:0}
.lbl{font-size:13px;color:var(--muted);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:128px;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--chrome-solid);border:2px solid var(--accent);margin-top:-10px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--chrome-solid);border:2px solid var(--accent)}
.prev{width:34px;height:34px;display:grid;place-items:center;flex:none}
.prev i{display:block;border-radius:50%;background:var(--ink)}
output{font-size:13px;font-variant-numeric:tabular-nums;min-width:28px;color:var(--muted)}
.seg{display:flex;background:var(--hover);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:500;padding:0 11px;height:34px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--chrome-solid);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font-size:13px;font-weight:500;padding:0 12px;height:36px;border-radius:10px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.shapebtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 8px 0 4px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
.shapebtn canvas{width:32px;height:32px}
.shapebtn svg.i{width:16px;height:16px}

/* bottom right status */
.status{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5;flex-wrap:wrap;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:1px;padding:4px;border-radius:15px}
.pill .ib{width:38px;height:38px}
.pill .num{border:0;background:transparent;color:var(--ink);min-width:58px;height:38px;border-radius:10px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer}
.pill .num:hover{background:var(--hover)}

/* popovers */
.pop{position:fixed;z-index:20;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 100px);overflow-y:auto;background:var(--chrome-solid)}
.pop h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
#morePop{top:calc(70px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:min(320px,calc(100vw - 24px))}
#shapePop{width:min(372px,calc(100vw - 24px))}
#syncPop{top:calc(70px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:min(320px,calc(100vw - 24px))}
#syncPop p{margin:0 0 6px;font-size:13px;line-height:1.6;color:var(--muted)}
#syncPop .who{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
#syncPop .who li{display:flex;align-items:center;gap:8px}
#syncPop .who i{width:10px;height:10px;border-radius:50%;flex:none}
#syncPop section{display:flex;flex-direction:column;gap:8px}
#syncPop .btn{width:100%}
#syncPop .acts{display:grid;grid-template-columns:1fr 1fr}
#syncPop .acts .btn:only-child{grid-column:1/-1}
.linkrow{display:flex;gap:6px}
.linkrow .btn{width:auto!important;flex:none}
.linkrow input,#nameIn{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--app);color:var(--ink);font:14px var(--ui);-webkit-user-select:text;user-select:text}
#nameIn{width:100%;box-sizing:border-box;font-size:16px}
.sync{gap:7px!important;font-size:13px!important}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-state="live"] .dot{background:#2f9e44;box-shadow:0 0 0 3px rgba(47,158,68,.18)}
.sync[data-state="connecting"] .dot,.sync[data-state="slow"] .dot{background:#f59f00}
.sync[data-state="error"] .dot{background:var(--danger)}
.sync[data-state="ro"] .dot{background:#1c7ed6}
.faces{display:flex}
.faces:empty{display:none}
.faces i{width:22px;height:22px;border-radius:50%;margin-left:-6px;border:2px solid var(--chrome-solid);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;text-transform:uppercase}
.faces i:first-child{margin-left:0}
.faces i.more{background:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scell{border:0;background:transparent;color:var(--ink);border-radius:12px;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;cursor:pointer}
.scell canvas{width:44px;height:44px}
.scell span{text-align:center;line-height:1.25}
.scell:hover{background:var(--hover)}
.scell[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.papers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.paper{border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;cursor:pointer}
.paper i{width:34px;height:24px;border-radius:6px;background:var(--p);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.paper[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 2px;cursor:pointer}
.row span{flex:1;display:flex;flex-direction:column;gap:2px}
.row b{font-size:14px;font-weight:500}
.row small{font-size:12px;color:var(--muted)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.row[aria-checked="true"] .sw{background:var(--accent)}
.row[aria-checked="true"] .sw::after{transform:translateX(18px)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:42px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn svg.i{width:18px;height:18px}
.acts .btn.danger{grid-column:1/-1}
.gest{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;color:var(--muted)}
.gest b{display:block;color:var(--ink);font-weight:500;font-size:13px}

/* selection menu */
#selmenu{position:fixed;left:0;top:0;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:4px;border-radius:13px;z-index:7;max-width:calc(100vw - 16px)}
#selmenu .acc{color:var(--accent);font-weight:700}
#selmenu .vsep{width:1px;background:var(--line);margin:6px 3px}
#selmenu .foldrow{display:flex;align-items:center;gap:4px;padding:0 4px 0 0;flex-basis:100%;justify-content:center;border-bottom:1px solid var(--line);margin-bottom:2px;padding-bottom:4px}
#selmenu .foldrow input{width:min(220px,40vw)}
#selmenu .foldrow output{min-width:40px;text-align:right}
#selmenu .seg button{height:32px}
#selmenu button[aria-pressed="true"]:not(.seg button){background:var(--accent-soft);color:var(--accent)}
#selmenu .foldrow #bkCount{min-width:0;padding:0 8px;white-space:nowrap}
#selmenu button{border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:500;height:36px;padding:0 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
#selmenu button:hover{background:var(--hover)}
#selmenu .danger{color:var(--danger)}

/* text editor */
#texted{position:fixed;z-index:4;background:transparent;border:0;outline:1.5px dashed var(--accent);outline-offset:5px;resize:none;padding:0;margin:0;font-family:"Noto Sans TC","PingFang TC",sans-serif;font-weight:500;line-height:1.3;overflow:hidden;white-space:pre;-webkit-user-select:text;user-select:text;caret-color:var(--accent)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);display:grid;place-items:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--chrome-solid);color:var(--ink);border-radius:20px;padding:18px;width:min(92vw,880px);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card.small{width:min(92vw,380px)}
.card h2{margin:0;font-size:17px;font-weight:700}
.card p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.card .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#exImg{display:block;max-width:100%;max-height:62vh;margin:0 auto;object-fit:contain;border-radius:10px;border:1px solid var(--line);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);opacity:0;transition:opacity .18s,transform .18s;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:14px;background:var(--ink);color:var(--chrome-solid);font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast button{border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:700;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;filter:brightness(1.25)}

@media (max-width:900px){
  .top{flex-direction:column-reverse;align-items:stretch;left:calc(82px + env(safe-area-inset-left,0px))}
  .actions{align-self:flex-end;margin-left:0}
  .props{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .grp.hint{max-width:none;white-space:nowrap}
  .sgrid{grid-template-columns:repeat(3,1fr)}
  .tool{width:52px}
}
@media (min-width:721px) and (max-width:900px){
  .props{flex-wrap:wrap;overflow:visible}
  .grp.hint{white-space:normal}
}
@media (prefers-reduced-motion: reduce){ #toast,.sw,.sw::after{transition:none} }
</style>

<div id="stage">
  <canvas class="layer" id="bg"></canvas>
  <canvas class="layer" id="board" aria-label="畫布"></canvas>
</div>

<nav class="rail chrome" aria-label="工具">
  <button class="tool" data-tool="select" aria-label="選取 (V)"><svg class="i" data-i="select"></svg>選取</button>
  <button class="tool" data-tool="hand" aria-label="移動畫布 (H)"><svg class="i" data-i="hand"></svg>移動</button>
  <hr>
  <button class="tool" data-tool="pen" aria-label="畫筆 (P)"><svg class="i" data-i="pen"></svg>畫筆</button>
  <button class="tool" data-tool="hl" aria-label="螢光筆 (M)"><svg class="i" data-i="hl"></svg>螢光筆</button>
  <button class="tool" data-tool="eraser" aria-label="橡皮擦 (E)"><svg class="i" data-i="eraser"></svg>橡皮擦</button>
  <button class="tool" data-tool="shape" aria-label="圖形 (S)"><svg class="i" data-i="shape"></svg>圖形</button>
  <button class="tool" data-tool="text" aria-label="文字 (T)"><svg class="i" data-i="text"></svg>文字</button>
  <button class="tool" data-tool="laser" aria-label="雷射筆 (L)"><svg class="i" data-i="laser"></svg>雷射筆</button>
  <hr>
  <button class="tool" id="railImg" aria-label="插入圖片"><svg class="i" data-i="image"></svg>圖片</button>
</nav>

<div class="top">
  <div class="props chrome" id="props">
    <div class="grp" id="gShape">
      <button class="shapebtn" id="shapeBtn" aria-haspopup="true" aria-expanded="false"><canvas id="shapeIco" width="64" height="64"></canvas><span id="shapeName">矩形</span><svg class="i" data-i="chev"></svg></button>
    </div>
    <div class="grp" id="gColor">
      <div class="swatches" id="swatches"></div>
      <label class="swc custom" aria-label="自訂顏色"><input type="color" id="colorIn" value="#1d1d1f"></label>
    </div>
    <div class="grp" id="gWidth">
      <span class="lbl" id="wLbl">粗細</span>
      <input type="range" id="wIn" min="1" max="40" step="1" aria-label="粗細">
      <span class="prev"><i id="wPrev"></i></span>
      <output id="wOut">4</output>
    </div>
    <div class="grp" id="gFill">
      <div class="seg" data-key="fill"><button data-v="none">空心</button><button data-v="tint">淡色</button><button data-v="solid">實心</button></div>
      <button class="chip" id="dashT" aria-pressed="false">虛線</button>
      <button class="chip" id="lockT" aria-pressed="false">等比例</button>
    </div>
    <div class="grp" id="gEraser">
      <div class="seg" data-key="eraserMode"><button data-v="pixel">局部擦除</button><button data-v="object">整筆擦除</button></div>
    </div>
    <div class="grp" id="gMirror">
      <button class="chip" id="mirrorT" aria-pressed="false">對稱繪圖</button>
      <div class="seg" data-key="mirrorMode" id="mirrorSeg"><button data-v="v">左右</button><button data-v="h">上下</button><button data-v="x">四向</button></div>
      <button class="chip" id="mirrorC">移到畫面中間</button>
    </div>
    <div class="grp hint" id="gHint"></div>
  </div>
  <div class="actions chrome">
    <button class="ib lab sync" id="syncBtn" aria-haspopup="true" aria-expanded="false" data-state="local"><i class="dot"></i><span id="syncTxt">單機</span><span class="faces" id="faces"></span></button>
    <button class="ib" id="undoBtn" aria-label="復原"><svg class="i" data-i="undo"></svg></button>
    <button class="ib" id="redoBtn" aria-label="重做"><svg class="i" data-i="redo"></svg></button>
    <button class="ib lab" id="clearBtn" aria-label="清空這一頁"><svg class="i" data-i="trash"></svg>清空</button>
    <button class="ib" id="moreBtn" aria-label="更多設定" aria-haspopup="true" aria-expanded="false"><svg class="i" data-i="more"></svg></button>
  </div>
</div>

<div class="status">
  <div class="pill chrome" aria-label="縮放">
    <button class="ib" id="zoomOut" aria-label="縮小"><svg class="i" data-i="minus"></svg></button>
    <button class="num" id="zoomLbl" aria-label="恢復 100%">100%</button>

  const h=[];for(let r=0;r<m;r++)for(let c=0;c<m;c++)h.push(r<n&&c<n?o.h[r*n+c]:0);
  return{...o,n:m,h};
}
function createBlocks(key,wx,wy){
  const T=BK_T[key]||BK_T.bk_empty;
  const o={k:'blocks',x:r1(wx),y:r1(wy+40/cam.s),u:r1(30/cam.s),n:T.n,h:T.h.slice(),c:S.color,w:Math.max(1,r1(S.shapeW*.5)),fill:S.fill==='none'?'tint':S.fill,yaw:DEF_VIEW.yaw,pitch:DEF_VIEW.pitch,views:false,hide3d:false};
  const st=commitAdd(o);setTool('select');sel=[st];needs=true;
  if(!S.tipBk){S.tipBk=true;scheduleSave();toast('點積木的任一面就會疊上一塊；切到「移除」再點就能拿掉',null,5000)}
}

function textLines(o){return o.t.split('\n')}
function measureText(o){mctx.font=TFONT(o.size);const ls=textLines(o);let w=0;for(const l of ls)w=Math.max(w,mctx.measureText(l).width);return{w:Math.max(w,o.size*.5),h:ls.length*o.size*1.3}}
function drawText(ctx,o){ctx.save();ctx.font=TFONT(o.size);ctx.fillStyle=o.c;ctx.textBaseline='top';textLines(o).forEach((l,i)=>ctx.fillText(l,o.x,o.y+i*o.size*1.3+o.size*.12));ctx.restore()}

const imgCache=new Map();
function getImg(src){let im=imgCache.get(src);if(!im){im=new Image();im.onload=()=>renderCommitted();im.src=src;imgCache.set(src,im)}return im}

function drawObj(ctx,o){
  switch(o.k){
    case 'stroke':case 'erase':drawStroke(ctx,o);break;
    case 'shape':drawShape(ctx,o);break;
    case 'text':drawText(ctx,o);break;
    case 'blocks':drawBlocks(ctx,o);break;
    case 'sym':drawSym(ctx,o);break;
    case 'fold':drawFold(ctx,o);break;
    case 'img':{const im=getImg(o.src);if(im.complete&&im.naturalWidth)ctx.drawImage(im,o.x,o.y,o.w,o.h);break;}
  }
}

/* ---------- geometry ---------- */
function bbox(o){
  if(o.k==='stroke'||o.k==='erase'){
    let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;const p=o.pts;
    for(let i=0;i<p.length;i+=3){if(p[i]<a)a=p[i];if(p[i]>c)c=p[i];if(p[i+1]<b)b=p[i+1];if(p[i+1]>d)d=p[i+1]}
    const pad=o.w/2*(o.pr?1.7:1);return{x:a-pad,y:b-pad,w:c-a+2*pad,h:d-b+2*pad};
  }
  if(isNet(o)&&net3D(o)){const {S2}=netProj(o);let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const p of S2){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])}const pad=o.w/2+1;return{x:a-pad,y:b-pad,w:c-a+2*pad,h:d-b+2*pad}}
  if(o.k==='shape'){const pad=o.w/2+(LINEISH.has(o.s)?Math.max(4,o.w*1.5):1);const x=Math.min(o.x1,o.x2),y=Math.min(o.y1,o.y2);return{x:x-pad,y:y-pad,w:Math.abs(o.x2-o.x1)+2*pad,h:Math.abs(o.y2-o.y1)+2*pad}}
  if(o.k==='text'){const m=measureText(o);return{x:o.x,y:o.y,w:m.w,h:m.h}}
  if(o.k==='img')return{x:o.x,y:o.y,w:o.w,h:o.h};
  if(o.k==='blocks')return blocksLayout(o).B;
  if(o.k==='sym'){const f=frameOf(o),R=(o.showAxis??1)?Math.hypot(f.w,f.h)*.62:0,pad=o.w/2+2;const cx=f.x+f.w/2,cy=f.y+f.h/2,hw=Math.max(f.w/2,R*.72),hh=Math.max(f.h/2,R*.72);return{x:cx-hw-pad,y:cy-hh-pad,w:2*(hw+pad),h:2*(hh+pad)}}
  if(o.k==='fold'){const pad=8;return{x:Math.min(o.x1,o.x2)-pad,y:Math.min(o.y1,o.y2)-pad,w:Math.abs(o.x2-o.x1)+2*pad,h:Math.abs(o.y2-o.y1)+2*pad}}
  return{x:0,y:0,w:0,h:0};
}
function unionBBox(list){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const o of list){const q=bbox(o);a=Math.min(a,q.x);b=Math.min(b,q.y);c=Math.max(c,q.x+q.w);d=Math.max(d,q.y+q.h)}return{x:a,y:b,w:c-a,h:d-b}}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function hitObj(o,x,y,r){
  if(o.k==='erase')return false;
  if(o.k==='stroke'){
    const p=o.pts,n=p.length/3,R=r+o.w/2*(o.pr?1.3:1);
    const b=bbox(o);if(x<b.x-r||x>b.x+b.w+r||y<b.y-r||y>b.y+b.h+r)return false;
    if(n===1)return Math.hypot(x-p[0],y-p[1])<=R;
    for(let i=0;i<n-1;i++)if(distSeg(x,y,p[i*3],p[i*3+1],p[i*3+3],p[i*3+4])<=R)return true;
    return false;
  }
  if(o.k==='shape'&&LINEISH.has(o.s))return distSeg(x,y,o.x1,o.y1,o.x2,o.y2)<=r+o.w;
  if(o.k==='fold')return distSeg(x,y,o.x1,o.y1,o.x2,o.y2)<=r+6/cam.s;
  const b=bbox(o);return x>=b.x-r&&x<=b.x+b.w+r&&y>=b.y-r&&y<=b.y+b.h+r;
}
function topHit(x,y,filter){const r=12/cam.s,objs=pg().objects;for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(o.k==='erase')continue;if(filter&&!filter(o))continue;if(hitObj(o,x,y,r))return o}return null}
function moveObj(o,dx,dy){
  switch(o.k){
    case 'stroke':case 'erase':{const p=o.pts.slice();for(let i=0;i<p.length;i+=3){p[i]=r1(p[i]+dx);p[i+1]=r1(p[i+1]+dy)}return{...o,pts:p}}
    case 'shape':case 'sym':case 'fold':return{...o,x1:o.x1+dx,y1:o.y1+dy,x2:o.x2+dx,y2:o.y2+dy};
    default:return{...o,x:o.x+dx,y:o.y+dy};
  }
}
function scaleObj(o,ox,oy,sx,sy){
  const X=v=>ox+(v-ox)*sx,Y=v=>oy+(v-oy)*sy;
  switch(o.k){
    case 'stroke':case 'erase':{const p=o.pts.slice();for(let i=0;i<p.length;i+=3){p[i]=r1(X(p[i]));p[i+1]=r1(Y(p[i+1]))}return{...o,pts:p}}
    case 'shape':case 'sym':case 'fold':return{...o,x1:X(o.x1),y1:Y(o.y1),x2:X(o.x2),y2:Y(o.y2)};
    case 'text':return{...o,x:X(o.x),y:Y(o.y),size:Math.max(6,r1(o.size*sy))};
    case 'img':return{...o,x:X(o.x),y:Y(o.y),w:o.w*sx,h:o.h*sy};
    case 'blocks':return{...o,x:X(o.x),y:Y(o.y),u:Math.max(2,o.u*sx)};
  }
  return o;
}

/* ---------- history ---------- */
function normalizeArr(arr){
  const seen=new Set();let prev=-Infinity;
  return arr.map(o=>{let n=o;if(!n.id||seen.has(n.id))n={...n,id:uid()};seen.add(n.id);if(n.z==null||!(n.z>prev))n={...n,z:prev===-Infinity?0:prev+1};prev=n.z;return n});
}
function remapSel(){const m=new Map(pg().objects.map(o=>[o.id,o]));sel=sel.map(o=>m.get(o.id)).filter(Boolean)}
function diffObjs(a,b){
  const ma=new Map(a.map(o=>[o.id,o])),mb=new Map(b.map(o=>[o.id,o])),before={},after={};let any=false;
  for(const [id,o] of mb){const a=ma.get(id);if(a!==o&&!(a&&JSON.stringify(a)===JSON.stringify(o))){before[id]=a||null;after[id]=o;any=true}}
  for(const [id,o] of ma)if(!mb.has(id)){before[id]=o;after[id]=null;any=true}
  return any?{before,after}:null;
}
function applyPatch(p,map){const m=new Map(p.objects.map(o=>[o.id,o]));for(const id in map){if(map[id])m.set(id,map[id]);else m.delete(id)}p.objects=sortZ([...m.values()])}
function pushHistory(before){
  const p=pg();
  if(sync.on&&sync.readOnly){p.objects=before;remapSel();renderCommitted(null);readOnlyToast();return}
  p.objects=normalizeArr(p.objects);remapSel();
  const d=diffObjs(before,p.objects);if(!d)return;
  p.undo.push(d);if(p.undo.length>200)p.undo.shift();p.redo=[];
  syncWrite(p,d.after);scheduleSave();updateUndo();
}
function commit(newObjs){const before=pg().objects;pg().objects=newObjs;pushHistory(before)}
function commitAdd(o){if(!o.id)o.id=uid();commit([...pg().objects,o]);if(camEq(cam,renderedCam)&&!excluded&&!activeFold(pg().objects)){setWorld(cctx);drawObj(cctx,o);needs=true}else renderCommitted();return pg().objects.find(x=>x.id===o.id)||o}
function afterHistory(){remapSel();renderCommitted(null);scheduleSave();updateUndo()}
function undo(quiet){if(anim)return;if(sync.on&&sync.readOnly){readOnlyToast();return}const p=pg();if(!p.undo.length){toast('沒有可以復原的步驟');return}const d=p.undo.pop();applyPatch(p,d.before);p.redo.push(d);syncWrite(p,d.before);afterHistory();if(!quiet)toast('已復原',null,900)}
function redo(quiet){if(anim)return;if(sync.on&&sync.readOnly){readOnlyToast();return}const p=pg();if(!p.redo.length){toast('沒有可以重做的步驟');return}const d=p.redo.pop();applyPatch(p,d.after);p.undo.push(d);syncWrite(p,d.after);afterHistory();if(!quiet)toast('已重做',null,900)}
function updateUndo(){$('#undoBtn').disabled=!pg().undo.length;$('#redoBtn').disabled=!pg().redo.length}

/* ---------- background ---------- */
function drawPaper(ctx,c,w,h){
  const P=PAPERS[S.paper]||PAPERS.white;
  ctx.fillStyle=P.bg;ctx.fillRect(0,0,w,h);
  if(S.bgType==='none')return;
  let step=40*c.s;while(step<14)step*=5;
  const mod=(a,m)=>((a%m)+m)%m;
  if(S.bgType==='grid'){
    const lines=(st,col)=>{ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();for(let x=mod(c.tx,st);x<w;x+=st){ctx.moveTo(x,0);ctx.lineTo(x,h)}for(let y=mod(c.ty,st);y<h;y+=st){ctx.moveTo(0,y);ctx.lineTo(w,y)}ctx.stroke()};
    lines(step,P.minor);lines(step*5,P.major);
  }else if(S.bgType==='dots'){
    const r=clamp(step/22,1,2.2);ctx.fillStyle=P.dot;ctx.beginPath();
    for(let x=mod(c.tx,step);x<w;x+=step)for(let y=mod(c.ty,step);y<h;y+=step){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,Math.PI*2)}
    ctx.fill();
  }else if(S.bgType==='lines'){
    ctx.strokeStyle=P.major;ctx.lineWidth=1;ctx.beginPath();
    for(let y=mod(c.ty,step);y<h;y+=step){ctx.moveTo(0,y);ctx.lineTo(w,y)}ctx.stroke();
  }
}
function drawBg(){bctx.setTransform(DPR,0,0,DPR,0,0);drawPaper(bctx,cam,W,H)}

/* ---------- live layer ---------- */
let laser=[],cursorPt=null,sel=[];
function rotHandle(sb){return{x:sb.x+sb.w/2,y:sb.y+sb.h+40}}
function screenBox(b){return{x:b.x*cam.s+cam.tx,y:b.y*cam.s+cam.ty,w:b.w*cam.s,h:b.h*cam.s}}
function drawLive(now){
  setWorld(dctx);
  if(peers.length)drawPeersWorld();
  if(action){
    if(action.kind==='draw'||action.kind==='shape')drawObj(dctx,action.o);
    if(action.kind==='draw'&&mirrorOn())for(const c of mirrorCopies(action.o))drawObj(dctx,c);
    if((action.kind==='move'||action.kind==='resize'||action.kind==='rot3d')&&action.preview)for(const o of action.preview)drawObj(dctx,o);
  }
  dctx.setTransform(DPR,0,0,DPR,0,0);
  // line angle readout
  if(action&&action.kind==='shape'&&LINEISH.has(action.o.s)){
    const o=action.o,len=Math.hypot(o.x2-o.x1,o.y2-o.y1);
    if(len*cam.s>20){let deg=Math.round(-Math.atan2(o.y2-o.y1,o.x2-o.x1)*180/Math.PI);if(deg<0)deg+=360;
      const sx=o.x2*cam.s+cam.tx+14,sy=o.y2*cam.s+cam.ty-30;pillText(`${deg}°`,sx,sy)}
  }
  // selection
  const list=action&&(action.kind==='move'||action.kind==='resize'||action.kind==='rot3d')?action.preview:sel;
  if(list&&list.length){
    const b=screenBox(unionBBox(list));
    dctx.strokeStyle=ACCENT;dctx.lineWidth=1.5;dctx.setLineDash([6,5]);dctx.strokeRect(b.x-4,b.y-4,b.w+8,b.h+8);dctx.setLineDash([]);
    dctx.beginPath();dctx.arc(b.x+b.w+4,b.y+b.h+4,9,0,Math.PI*2);dctx.fillStyle='#fff';dctx.fill();dctx.lineWidth=2;dctx.stroke();
    if(list.length===1&&canRotate(list[0])){
      const h=rotHandle(b);
      dctx.beginPath();dctx.moveTo(h.x,b.y+b.h+4);dctx.lineTo(h.x,h.y-15);dctx.strokeStyle=ACCENT;dctx.lineWidth=1.2;dctx.stroke();
      dctx.beginPath();dctx.arc(h.x,h.y,15,0,Math.PI*2);dctx.fillStyle=ACCENT;dctx.fill();
      dctx.strokeStyle='#fff';dctx.lineWidth=2;dctx.lineCap='round';dctx.beginPath();dctx.arc(h.x,h.y,7,-Math.PI*.15,Math.PI*1.35);dctx.stroke();
      const ex=h.x+7*Math.cos(-Math.PI*.15),ey=h.y+7*Math.sin(-Math.PI*.15);
      dctx.beginPath();dctx.moveTo(ex+3.5,ey-2.5);dctx.lineTo(ex,ey);dctx.lineTo(ex-3,ey-4);dctx.stroke();dctx.lineCap='butt';
      if(action&&action.kind==='rot3d'&&action.moved)pillText(`左右 ${action.yaw}°・上下 ${action.pitch}°`,h.x+22,h.y-12);
    }
  }
  if(action&&action.kind==='marquee'){
    const x=Math.min(action.x1,action.x2),y=Math.min(action.y1,action.y2),w=Math.abs(action.x2-action.x1),h=Math.abs(action.y2-action.y1);
    dctx.fillStyle=ACCENT;dctx.globalAlpha=.08;dctx.fillRect(x,y,w,h);dctx.globalAlpha=1;
    dctx.strokeStyle=ACCENT;dctx.lineWidth=1.2;dctx.setLineDash([5,4]);dctx.strokeRect(x,y,w,h);dctx.setLineDash([]);
  }
  if(mirrorOn()){
    const mx=S.mirrorPt[0]*cam.s+cam.tx,my=S.mirrorPt[1]*cam.s+cam.ty;
    dctx.save();dctx.strokeStyle=ACCENT;dctx.globalAlpha=.55;dctx.lineWidth=1.5;dctx.setLineDash([10,6]);dctx.beginPath();
    if(S.mirrorMode!=='h'){dctx.moveTo(mx,0);dctx.lineTo(mx,H)}
    if(S.mirrorMode!=='v'){dctx.moveTo(0,my);dctx.lineTo(W,my)}
    dctx.stroke();dctx.restore();
  }
  // cursor previews
  if(cursorPt){
    if(S.tool==='eraser'){
      dctx.beginPath();dctx.arc(cursorPt.x,cursorPt.y,S.eraserSize/2,0,Math.PI*2);
      dctx.fillStyle='rgba(255,255,255,.35)';dctx.fill();dctx.lineWidth=1.5;dctx.strokeStyle='rgba(40,44,60,.7)';dctx.stroke();
      dctx.beginPath();dctx.arc(cursorPt.x,cursorPt.y,S.eraserSize/2+1.5,0,Math.PI*2);dctx.strokeStyle='rgba(255,255,255,.7)';dctx.lineWidth=1;dctx.stroke();
    }else if(!action&&(S.tool==='pen'||S.tool==='hl')){
      const r=Math.max(2,(S.tool==='pen'?S.penW:S.hlW)*cam.s/2);
      dctx.beginPath();dctx.arc(cursorPt.x,cursorPt.y,r,0,Math.PI*2);dctx.fillStyle=S.color;dctx.globalAlpha=S.tool==='hl'?.35:.6;dctx.fill();dctx.globalAlpha=1;
      dctx.lineWidth=1;dctx.strokeStyle='rgba(120,124,140,.8)';dctx.stroke();
    }
  }
  if(peers.length)drawPeersScreen();
  // laser
  if(laser.length){
    laser=laser.filter(p=>now-p.t<900);
    dctx.save();dctx.lineCap='round';dctx.lineJoin='round';dctx.shadowColor='#ff2d55';dctx.shadowBlur=14;
    for(let i=1;i<laser.length;i++){
      const a=laser[i-1],b=laser[i];if(b.brk)continue;
      const age=(now-b.t)/900;dctx.globalAlpha=Math.max(0,1-age);
      dctx.strokeStyle='#ff2d55';dctx.lineWidth=5*(1-age*.5);
      dctx.beginPath();dctx.moveTo(a.x*cam.s+cam.tx,a.y*cam.s+cam.ty);dctx.lineTo(b.x*cam.s+cam.tx,b.y*cam.s+cam.ty);dctx.stroke();
    }
    const last=laser[laser.length-1];
    if(last&&action&&action.kind==='laser'){dctx.globalAlpha=1;dctx.fillStyle='#fff';dctx.beginPath();dctx.arc(last.x*cam.s+cam.tx,last.y*cam.s+cam.ty,3.5,0,Math.PI*2);dctx.fill()}
    dctx.restore();
  }
}
function pillText(t,x,y){
  dctx.font='600 13px "Noto Sans TC",sans-serif';const w=dctx.measureText(t).width+16;
  dctx.fillStyle='rgba(20,22,30,.82)';dctx.beginPath();dctx.roundRect?dctx.roundRect(x,y,w,24,8):dctx.rect(x,y,w,24);dctx.fill();
  dctx.fillStyle='#fff';dctx.textBaseline='middle';dctx.fillText(t,x+8,y+12.5);
}

function frame(){
  requestAnimationFrame(frame);
  const now=performance.now();
  if(laser.length)needs=true;
  const eb=S.tool==='select'&&sel.length===1&&sel[0].k==='blocks'&&!action?sel[0]:null;
  if(eb!==EDIT_BK&&!(action&&action.kind!=='marquee')){EDIT_BK=eb;renderCommitted()}
  if(!needs&&!bgDirty)return;
  needs=false;
  if(bgDirty){drawBg();bgDirty=false}
  dctx.setTransform(1,0,0,1,0,0);dctx.clearRect(0,0,board.width,board.height);
  if(camEq(cam,renderedCam))dctx.drawImage(comm,0,0);
  else{const r=cam.s/renderedCam.s;dctx.setTransform(r,0,0,r,(cam.tx-renderedCam.tx*r)*DPR,(cam.ty-renderedCam.ty*r)*DPR);dctx.drawImage(comm,0,0)}
  drawLive(now);
  updateSelMenu();
}

/* ---------- camera ---------- */
function camChanged(){bgDirty=true;needs=true;updateZoom();if(textEdit)layoutText();scheduleSave()}
function zoomAt(f,sx=W/2,sy=H/2){const s=clamp(cam.s*f,.1,8);const wx=(sx-cam.tx)/cam.s,wy=(sy-cam.ty)/cam.s;cam.s=s;cam.tx=sx-wx*s;cam.ty=sy-wy*s;camChanged();renderSoon()}
function updateZoom(){$('#zoomLbl').textContent=Math.round(cam.s*100)+'%'}
function viewArea(){const narrow=W<=900;return{l:narrow?84:96,t:narrow?150:84,r:20,b:72}}
function fitContent(){
  const vis=pg().objects.filter(o=>o.k!=='erase');const v=viewArea();
  const aw=Math.max(100,W-v.l-v.r),ah=Math.max(100,H-v.t-v.b);
  if(!vis.length){cam.s=1;cam.tx=v.l+40;cam.ty=v.t+40}
  else{const b=unionBBox(vis);const s=clamp(Math.min(aw/(b.w+40),ah/(b.h+40)),.1,2);cam.s=s;cam.tx=v.l+aw/2-(b.x+b.w/2)*s;cam.ty=v.t+ah/2-(b.y+b.h/2)*s}
  camChanged();renderCommitted();
}

/* ---------- input ---------- */
const touches=new Map();let gest=null,pan=null,action=null,suppressTouch=false;
board.addEventListener('pointerdown',onDown);
board.addEventListener('pointermove',onMove);
board.addEventListener('pointerup',e=>onUp(e,false));
board.addEventListener('pointercancel',e=>onUp(e,true));
board.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch'&&!action){cursorPt=null;needs=true;sendPresence(null,null,true)}});
board.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
board.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
board.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

function onDown(e){
  if(anim)return;
  if(textEdit){finishText();return}
  closePops();
  try{board.setPointerCapture(e.pointerId)}catch(_){}
  const x=e.clientX,y=e.clientY;
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x,y});
    if(action&&!action.touch)return; // palm while Pencil draws
    if(touches.size>=2){if(action&&action.touch)cancelAction();pan=null;startGesture();return}
    if(suppressTouch)return;
    if(S.pencilOnly||S.tool==='hand'){startPan(e);return}
    if(action)return;
    startAction(e,true);return;
  }
  if(e.button===1||e.button===2||S.tool==='hand'){startPan(e);return}
  if(action)return;
  startAction(e,false);
}
function startGesture(){
  const [a,b]=[...touches.values()];
  if(!gest)gest={t0:performance.now(),maxN:touches.size,moved:false};

function startPan(e){pan={id:e.pointerId,x0:e.clientX,y0:e.clientY,cam0:{...cam}}}

function onMove(e){
  const x=e.clientX,y=e.clientY;

    const t=touches.get(e.pointerId);if(t){t.x=x;t.y=y}

  if(action&&action.id===e.pointerId){

function onUp(e,cancel){

  if(action&&action.id===e.pointerId){cancel?cancelAction():endAction(e)}
  if(e.pointerType==='touch'){cursorPt=null;needs=true}
}

function startAction(e,touch){

      const o={k:'stroke',pts:[r1(wx),r1(wy),r2(pr)],c:S.color,w:hl?S.hlW:S.penW,o:hl?.38:1,pr:!hl&&S.pressure&&e.pointerType==='pen'};
      action={kind:'draw',id,touch,o,lx:x,ly:y,lp:pr};break;}
    case 'eraser':

    case 'text':action={kind:'text',id,touch,sx:x,sy:y,wx,wy};break;

function endAction(e){

    case 'oerase':if(a.removed)pushHistory(a.before);break;

function cancelAction(){

/* ---------- selection ---------- */
function startSelect(x,y,wx,wy,id,touch){
  const begin=kind=>{const b=unionBBox(sel);action={kind,id,touch,sx:x,sy:y,wx0:wx,wy0:wy,b0:b,orig:sel.slice(),preview:sel.slice(),moved:false};renderCommitted(idSet(sel))};
  if(sel.length===1&&canRotate(sel[0])){
    const o=sel[0],h=rotHandle(screenBox(unionBBox(sel)));
    if(Math.hypot(x-h.x,y-h.y)<26){
      const d=isNet(o)?NET_VIEW:DEF_VIEW;
      action={kind:'rot3d',id,touch,sx:x,sy:y,orig:[o],preview:[o],moved:false,yaw0:o.yaw??d.yaw,pitch0:o.pitch??d.pitch,yaw:Math.round(o.yaw??d.yaw),pitch:Math.round(o.pitch??d.pitch)};
      renderCommitted(idSet(sel));return;
    }
  }
  if(sel.length){
    const b=unionBBox(sel),sb=screenBox(b);
    if(Math.hypot(x-(sb.x+sb.w+4),y-(sb.y+sb.h+4))<28){begin('resize');return}
    const pad=10/cam.s;
    if(wx>=b.x-pad&&wx<=b.x+b.w+pad&&wy>=b.y-pad&&wy<=b.y+b.h+pad){begin('move');action.wasSel=true;return}
  }
  const h=topHit(wx,wy);
  if(h){sel=[h];if(canRotate(h)&&!S.tipRot){S.tipRot=true;scheduleSave();toast('拖曳下方的藍色旋轉鈕，就能轉動立體圖形',null,4000)}begin('move');return}

}
function updateSelMenu(){
  const m=$('#selmenu');const show=sel.length&&!action&&!gest&&S.tool==='select'&&(!anim||canFold(sel[0]));
  if(!show){if(!m.hidden)m.hidden=true;return}
  const key=selMenuKey();if(key!==selKey){selKey=key;m.innerHTML=(SM_EXTRA[key]||'')+SM_COMMON}
  m.hidden=false;
  if(key==='blocks'){
    const o=sel[0],t=o.h.reduce((a,b)=>a+b,0);
    m.querySelector('[data-sa="bk-add"]').setAttribute('aria-pressed',String(S.bkMode!=='del'));
    m.querySelector('[data-sa="bk-del"]').setAttribute('aria-pressed',String(S.bkMode==='del'));
    m.querySelector('[data-sa="bk-views"]').setAttribute('aria-pressed',String(!!o.views));
    const hb=m.querySelector('[data-sa="bk-hide"]');hb.textContent=o.hide3d?'顯示立體':'藏起立體';
    $('#bkCount').textContent=`共 ${t} 塊・底盤 ${o.n}×${o.n}`;
  }
  if(key==='net'){
    const o=sel[0],p=netProg(o),fi=$('#foldIn');
    if(!sliding){fi.value=Math.round(p*100);$('#foldOut').textContent=Math.round(p*100)+'%'}
    m.querySelector('[data-sa="rot90"]').hidden=p>0;m.querySelector('[data-sa="flip"]').hidden=p>0;
    m.querySelector('[data-sa="v-iso"]').hidden=!(o.fold>=.999);
  }
  if(key==='sym'||key==='fold'){
    const o=sel[0],v=Math.round(progOf(o)*100);
    if(!sliding){$('#foldIn').value=v;$('#foldOut').textContent=foldText(o,v)}
    if(key==='sym'){const F=SYMF[o.fig],n=F?F.axes.length:1,ai=(o.axis||0)%n,sh=o.showAxis??1;
      m.querySelector('[data-sa="sy-axis"]').textContent=`換對稱軸（${ai+1}/${n}）`;
      m.querySelector('[data-sa="sy-show"]').textContent=['顯示對稱軸','顯示全部對稱軸','隱藏對稱軸'][sh];}
  }
  if(sliding||(anim&&(key==='net'||key==='sym'||key==='fold')))return;
  const b=screenBox(unionBBox(sel)),mw=m.offsetWidth,mh=m.offsetHeight;
  const left=clamp(b.x+b.w/2-mw/2,8,W-mw-8);
  let top=b.y-mh-16;if(top<130)top=b.y+b.h+(canRotate(sel[0])&&sel.length===1?64:22);top=clamp(top,8,H-mh-8);
  m.style.transform=`translate(${Math.round(left)}px,${Math.round(top)}px)`;
}
let selKey='';
function selMenuKey(){if(sel.length!==1)return 'multi';const o=sel[0];if(o.k==='blocks')return 'blocks';if(o.k==='sym')return 'sym';if(o.k==='fold')return 'fold';if(isSolid(o))return 'solid';if(isNet(o))return 'net';return 'one'}
const SM_COMMON='<button data-sa="dup">複製</button><button data-sa="front">移到最上層</button><button data-sa="back">移到最下層</button><button data-sa="del" class="danger">刪除</button>';

function replaceObj(a,b){pg().objects=pg().objects.map(x=>x.id===a.id?b:x);sel=sel.map(x=>x.id===a.id?b:x)}

function animProg(o,to,dur){

let sliding=null;

  $$('.seg[data-key]').forEach(seg=>seg.querySelectorAll('button[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(S[seg.dataset.key]===b.dataset.v))));
  $('#dashT').setAttribute('aria-pressed',String(S.dash));
  $('#mirrorT').setAttribute('aria-pressed',String(!!S.mirror));$('#mirrorSeg').hidden=!S.mirror;$('#mirrorC').hidden=!S.mirror;$('#lockT').setAttribute('aria-pressed',String(S.lock));
  $('#lockT').textContent=LINEISH.has(S.shape)?'鎖定角度':'等比例';
  $('#pencilT').setAttribute('aria-checked',String(S.pencilOnly));$('#pressT').setAttribute('aria-checked',String(S.pressure));
  $$('#papers .paper').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===S.paper)));
  $$('#shapePop .scell').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.shape===S.shape)));
  $('#shapeName').textContent=SHAPE_NAME[S.shape]||'';drawIcon($('#shapeIco'),S.shape);
  syncWidth();
  $('#pgLbl').textContent=`${cur+1} / ${pages.length}`;
  $('#prevPg').disabled=cur===0;$('#nextPg').disabled=cur>=pages.length-1;
  updateUndo();updateZoom();
  board.style.cursor=S.tool==='hand'?'grab':S.tool==='select'?'default':S.tool==='text'?'text':'crosshair';
}

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if(textEdit)return;if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='z'){e.preventDefault();e.shiftKey?redo(true):undo(true);return}
  if((e.metaKey||e.ctrlKey)&&k==='y'){e.preventDefault();redo(true);return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const map={v:'select',h:'hand',p:'pen',m:'hl',e:'eraser',s:'shape',t:'text',l:'laser'};
  if(map[k]){setTool(map[k]);return}
  if((k==='backspace'||k==='delete')&&sel.length){e.preventDefault();deleteSel();return}
  if(k==='escape'){closePops();sel=[];needs=true}
});
board.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey)zoomAt(Math.exp(-e.deltaY*.01),e.clientX,e.clientY);
  else{cam.tx-=e.deltaX;cam.ty-=e.deltaY;camChanged();renderSoon()}
},{passive:false});

/* ---------- sample content (first visit only) ---------- */
function sh(s,x1,y1,x2,y2,c,fill){return{k:'shape',s,x1,y1,x2,y2,c,w:3,fill,dash:false}}
function seedPage(){
  const P=blankPage(),o=P.objects;
  o.push({k:'text',x:0,y:-74,t:'範例內容：點右上角「清空」就能從空白開始',size:26,c:'#5b6272'});
  o.push(sh('cube',0,0,170,170,'#1c7ed6','tint'));
  o.push(sh('cyl',230,0,360,190,'#2f9e44','tint'));
  o.push(sh('cone',420,0,560,190,'#f76707','tint'));
  o.push(sh('sphere',620,10,790,180,'#5f3dc4','tint'));
  const pts=[];for(let i=0;i<=120;i++){const x=i*6.6,y=262+Math.sin(i/9)*16,p=.3+.45*Math.sin(i/120*Math.PI);pts.push(r1(x),r1(y),r2(p))}
  o.push({k:'stroke',pts,c:'#e03131',w:5,o:1,pr:true});
  o.push(sh('axes',0,330,240,550,'#1d1d1f','none'));
  o.push(sh('rtri',300,360,470,530,'#1d1d1f','none'));
  o.push(sh('star',540,350,720,530,'#f2b705','solid'));
  P.objects=withIds(o);
  return P;
}

/* ---------- init ---------- */
const loaded=load();
if(!loaded){pages=[seedPage()];cur=0}
cam=pg().cam;
readTokens();buildSwatches();buildShapePop();
resize();
if(!loaded)fitContent();
syncUI();drawAllIcons();
addEventListener('resize',()=>{resize();if(textEdit)layoutText()});
const mq=matchMedia('(prefers-color-scheme: dark)');
(mq.addEventListener?mq.addEventListener('change',()=>{drawAllIcons();needs=true}):mq.addListener(()=>drawAllIcons()));
new MutationObserver(()=>{drawAllIcons();needs=true}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>renderCommitted());
requestAnimationFrame(frame);
updateSyncUI();startSync();
})();
</script>
